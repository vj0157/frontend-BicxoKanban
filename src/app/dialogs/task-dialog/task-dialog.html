<p mat-dialog-title class="text-center text-2xl font-bold ">
    Add New Task
</p>
<mat-dialog-content>

    <form
        [formGroup]="taskForm"
        class="flex flex-col gap-5 mt-5">

        <mat-form-field appearance="outline">

            <mat-label>Task Title</mat-label>

            <input
                matInput
                formControlName="title">

            @if(taskForm.get('title')?.hasError('required')){

                <mat-error>

                    Title is required

                </mat-error>

            }

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Description</mat-label>

            <textarea
                matInput
                rows="5"
                formControlName="description">
            </textarea>

            @if(taskForm.get('description')?.hasError('required')){

                <mat-error>

                    Description is required

                </mat-error>

            }

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Priority</mat-label>

            <mat-select formControlName="priority">

                <mat-option value="High">High</mat-option>

                <mat-option value="Medium">Medium</mat-option>

                <mat-option value="Low">Low</mat-option>

            </mat-select>

        </mat-form-field>

    </form>

</mat-dialog-content>

<mat-dialog-actions align="end" class="gap-3">

    <button
        mat-stroked-button
        color="warn"
        class="h-11 min-w-[30] rounded-xl"
        (click)="close()">

        Cancel

    </button>

    <button
        mat-stroked-button
        color="primary"
        class="h-11 min-w-[30] rounded-xl"
        (click)="submit()">

        Create Task

    </button>

</mat-dialog-actions>
